[project]
name = "p2pilot"
version = "0.1.0"
description = "P2Pilot - agentic procure-to-pay assistant (portfolio project)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.40",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "mcp>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "faker>=28",
    "reportlab>=4.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["p2pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Plain `pytest` = unit tests only. `pytest -m integration` = database tests (needs Supabase).
addopts = '-m "not integration"'
markers = [
    "integration: needs the local Supabase stack running (set P2PILOT_DB_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
