# LiteLLM gateway config - Anthropic for chat.
# Anthropic has no embeddings API, so `embed` needs OpenAI or Azure (Sprint 3).
# Check current model ids at https://docs.claude.com before use.

model_list:
  - model_name: fast
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30

  - model_name: reasoning
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 90

litellm_settings:
  num_retries: 2
  request_timeout: 60
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
