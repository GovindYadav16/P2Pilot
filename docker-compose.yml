# P2Pilot local stack.
# Supabase (Postgres + Auth + Storage + PostgREST) runs separately via the Supabase CLI
# (`supabase start`); the API reaches it through host.docker.internal.
#
#   docker compose up -d --build            -> litellm + api (Sprint 1)
#   docker compose --profile data up -d     -> also qdrant, neo4j, redis (Sprint 2/3)

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: .env
    volumes:
      - ./deploy/litellm/config.${LLM_PROVIDER:-azure}.yaml:/app/config.yaml:ro
    ports: ["${LITELLM_HOST_PORT:-4001}:4000"]   # host port configurable (4000 is used by NoMachine); containers still use litellm:4000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8000:8000"]
    depends_on:
      litellm:
        condition: service_healthy

  qdrant:
    profiles: ["data"]
    image: qdrant/qdrant:v1.15.4
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]

  neo4j:
    profiles: ["data"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-p2pilot-dev-pass}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]

  redis:
    profiles: ["data"]
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  qdrant_data:
  neo4j_data:
